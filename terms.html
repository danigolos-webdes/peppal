<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pep Pal — Terms of use</title>
<link rel="icon" href="icon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#F5F4EF;color:#0B0B0A;font-family:"Schibsted Grotesk",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  main{max-width:660px;margin:0 auto;padding:40px 22px 80px}
  a{color:#1D4ED8}
  a:hover{color:#0B0B0A}
  .back{display:inline-block;margin-bottom:28px;font-weight:800;font-size:11px;letter-spacing:.14em;text-transform:uppercase;text-decoration:none}
  .draft{border:1.5px solid #B4231F;border-radius:16px;padding:14px 16px;margin-bottom:28px;font-size:13.5px;line-height:1.55;color:#B4231F}
  h1{font-size:34px;line-height:1.1;letter-spacing:-.03em;margin:0 0 18px}
  h2{font-size:19px;line-height:1.25;letter-spacing:-.01em;margin:32px 0 10px}
  p,li{font-size:15px;line-height:1.6}
  li{margin-bottom:6px}
  table{border-collapse:collapse;width:100%;font-size:14px;margin:14px 0}
  th,td{border:1px solid rgba(11,11,10,.18);padding:8px 10px;text-align:left;vertical-align:top}
  code{background:rgba(11,11,10,.07);padding:1px 5px;border-radius:5px;font-size:13px}
  .fill{background:#FFE8B0;border-bottom:2px solid #B4231F;padding:0 4px;border-radius:3px;font-weight:700}
  hr{border:none;border-top:1px solid rgba(11,11,10,.14);margin:34px 0}
  footer{margin-top:40px;font-size:12.5px;color:rgba(11,11,10,.55);line-height:1.6}
</style>
</head>
<body>
<main>
  <a class="back" href="./">← Pep Pal</a>
  <div class="draft" id="draft-note">This document is still a draft. Everything highlighted needs your real details, and a lawyer should read it before launch.</div>
  <div id="doc">Loading…</div>
  <footer>Pep Pal · <a href="privacy.html">Privacy policy</a> · <a href="terms.html">Terms of use</a></footer>
</main>
<script>
// Tiny markdown renderer — enough for these two documents, nothing more.
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function inline(s){
  return esc(s)
    .replace(/\[FILL IN([^\]]*)\]/g, function(m){return '<span class="fill">'+m+'</span>';})
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
}
function render(md){
  var lines = md.split("\n"), out = [], list = null, tbl = null, para = [];
  function closeList(){ if(list){ out.push("</ul>"); list = null; } }
  function closeTbl(){ if(tbl){ out.push("</tbody></table>"); tbl = null; } }
  // Source is hard-wrapped, so a paragraph is every line up to a blank one.
  function closePara(){ if(para.length){ out.push("<p>"+inline(para.join(" "))+"</p>"); para = []; } }
  for (var i=0;i<lines.length;i++){
    var l = lines[i];
    if (/^\s*$/.test(l)) { closePara(); closeList(); closeTbl(); continue; }
    if (/^\|/.test(l)) {
      closePara();
      var cells = l.split("|").slice(1,-1).map(function(c){return c.trim();});
      if (/^[-: |]+$/.test(l)) continue;
      if (!tbl){ tbl = 1; out.push("<table><tbody>"); }
      out.push("<tr>" + cells.map(function(c){return "<td>"+inline(c)+"</td>";}).join("") + "</tr>");
      continue;
    }
    closeTbl();
    var h = l.match(/^(#{1,3})\s+(.*)$/);
    if (h){ closePara(); closeList(); var lvl = h[1].length; out.push("<h"+lvl+">"+inline(h[2])+"</h"+lvl+">"); continue; }
    if (list && /^\s{2,}\S/.test(l) && !/^\s*[-*]\s/.test(l)) {
      out[out.length-1] = out[out.length-1].replace(/<\/li>$/, " " + inline(l.trim()) + "</li>");
      continue;
    }
    var li = l.match(/^\s*[-*]\s+(.*)$/) || l.match(/^\s*\d+\.\s+(.*)$/);
    if (li){ closePara(); if(!list){ out.push("<ul>"); list = 1; } out.push("<li>"+inline(li[1])+"</li>"); continue; }
    closeList();
    para.push(l.trim());
  }
  closePara(); closeList(); closeTbl();
  return out.join("\n");
}
fetch("legal/terms.md")
  .then(function(r){ return r.text(); })
  .then(function(md){
    document.getElementById("doc").innerHTML = render(md);
    var n = document.querySelectorAll(".fill").length;
    if (!n) document.getElementById("draft-note").remove();
  })
  .catch(function(){ document.getElementById("doc").textContent = "Could not load this document."; });
</script>
</body>
</html>
